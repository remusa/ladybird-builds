name: Build Ladybird (macOS arm64 nightly)

on:
  schedule:
    # Every Sunday at 06:00 UTC. Adjust cadence as upstream churn dictates.
    - cron: "0 6 * * 0"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write   # needed to create releases

env:
  LADYBIRD_REPO: LadybirdBrowser/ladybird
  LADYBIRD_REF: master

jobs:
  build:
    runs-on: macos-15   # Apple Silicon (arm64) by default on GitHub-hosted runners
    timeout-minutes: 300

    steps:
      - name: Checkout Ladybird source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LADYBIRD_REPO }}
          ref: ${{ env.LADYBIRD_REF }}
          fetch-depth: 0
          path: ladybird

      - name: Record source commit
        id: rev
        run: |
          cd ladybird
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies (Homebrew)
        run: |
          brew install autoconf autoconf-archive automake ccache cmake \
            libtool nasm ninja pkg-config rust llvm@21
          # Qt6 only needed if you want the Qt UI instead of the native AppKit chrome.
          # brew install qt@6

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ladybird-macos-arm64-ccache-${{ hashFiles('ladybird/vcpkg.json', 'ladybird/vcpkg-configuration.json') }}
          restore-keys: |
            ladybird-macos-arm64-ccache-

      - name: Build Ladybird
        working-directory: ladybird
        run: |
          # ladybird.py drives the CMake+vcpkg+ninja build end to end.
          # Check Documentation/BuildInstructionsLadybird.md in the source tree
          # if this invocation drifts from upstream's current expectations.
          export PATH="/opt/homebrew/opt/llvm@21/bin:$PATH"
          CC="$(brew --prefix llvm@21)/bin/clang" \
          CXX="$(brew --prefix llvm@21)/bin/clang++" \
          ./Meta/ladybird.py build

      - name: Locate, fix, and zip the .app bundle
        working-directory: ladybird
        run: |
          APP_PATH=$(find Build -maxdepth 4 -name "Ladybird.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find Ladybird.app in Build/ output"
            exit 1
          fi
          # Contents/lib is a symlink into the build tree — replace it
          # with a real directory containing all libraries the binary needs.
          LIB_DIR="$APP_PATH/Contents/lib"
          BUILD_LIB="$(readlink -f "$LIB_DIR")"
          VCPKG_LIB="$(find Build -path "*/vcpkg_installed/*/lib" -type d -print -quit)"
          rm "$LIB_DIR"
          mkdir -p "$LIB_DIR"
          # Copy lagom libraries from the build tree
          cp -a "$BUILD_LIB"/* "$LIB_DIR"/ 2>/dev/null || true
          # Copy vcpkg-installed libraries (skia, ssl, freetype, etc.)
          if [ -n "$VCPKG_LIB" ]; then
            cp -a "$VCPKG_LIB"/* "$LIB_DIR"/ 2>/dev/null || true
          fi
          # Resolve only symlinks that point outside the bundle
          while IFS= read -r -d '' link; do
            target=$(readlink "$link")
            # Skip relative symlinks (versioned library links) and
            # targets that resolve within the bundle.
            case "$target" in
              /*)
                case "$target" in
                  "$APP_PATH"*) ;; # inside bundle, keep
                  *) rm "$link"
                     if [ -e "$target" ]; then
                       cp -a "$target" "$link" 2>/dev/null || true
                     fi ;;
                esac ;;
            esac
          done < <(find "$APP_PATH" -type l -print0)
          # Rewrite hardcoded CI rpaths so dyld can find libraries at
          # install time.  All binaries live in Contents/MacOS and all
          # libraries in Contents/lib, so @executable_path/../lib works
          # for every executable.
          find "$APP_PATH/Contents/MacOS" "$APP_PATH/Contents/lib" "$APP_PATH/Contents/Frameworks" -type f \
            -exec file {} + | grep 'Mach-O' | cut -d: -f1 | while read -r bin; do
            # Remove CI-runner rpaths
            otool -l "$bin" 2>/dev/null \
              | awk '/^ *path /{print $2}' \
              | grep -E '^/' \
              | while read -r old; do
                install_name_tool -delete_rpath "$old" "$bin" 2>/dev/null || true
              done
            # Add portable rpaths
            install_name_tool -add_rpath @executable_path/../lib "$bin" 2>/dev/null || true
            install_name_tool -add_rpath @executable_path/../Frameworks "$bin" 2>/dev/null || true
            case "$bin" in
              */Contents/lib/*|*/Contents/Frameworks/*)
                install_name_tool -add_rpath @loader_path "$bin" 2>/dev/null || true
                install_name_tool -add_rpath @loader_path/.. "$bin" 2>/dev/null || true
                ;;
            esac
          done
          # Re-sign the bundle — install_name_tool invalidates the
          # existing signature and macOS will kill unsigned binaries.
          codesign --force --deep --sign - "$APP_PATH"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$GITHUB_WORKSPACE/dist/Ladybird-macos-arm64.zip"

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.rev.outputs.date }}
          name: "Ladybird nightly ${{ steps.rev.outputs.date }} (${{ steps.rev.outputs.sha }})"
          body: |
            Unofficial arm64 macOS build of Ladybird, built from
            ${{ env.LADYBIRD_REPO }}@${{ steps.rev.outputs.sha }}.

            Not an official release. Gatekeeper will quarantine this app;
            see this repo's README for how to run it.
          files: dist/Ladybird-macos-arm64.zip
          make_latest: true
