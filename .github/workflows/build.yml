name: Build Ladybird (macOS arm64 + Linux)

on:
  schedule:
    - cron: "0 2 * * 0,3"
  workflow_dispatch:
    inputs:
      selftest_failure:
        description: "Fail immediately, to test the failure notification (no build)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  LADYBIRD_REPO: LadybirdBrowser/ladybird
  RELEASE_RETENTION: 20
  LADYBIRD_REF: master

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 240
    outputs:
      date: ${{ steps.rev.outputs.date }}
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - name: Self-test failure
        if: github.event.inputs.selftest_failure == 'true'
        run: |
          echo "::error::deliberate failure - dispatched as a notification self-test"
          exit 1

      - name: Select newest Xcode
        run: |
          CANDIDATES=""
          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue
            case "$candidate" in *-beta*) continue ;; esac
            CANDIDATES="$CANDIDATES$candidate"$'\n'
          done
          if [ -z "$CANDIDATES" ]; then
            for candidate in /Applications/Xcode*.app; do
              [ -d "$candidate" ] || continue
              CANDIDATES="$CANDIDATES$candidate"$'\n'
            done
          fi
          if [ -z "$CANDIDATES" ]; then
            echo "::error::No Xcode.app found under /Applications"
            exit 1
          fi
          NEWEST_XCODE="$(printf '%s\n' "$CANDIDATES" \
            | awk -F/ '{ name=$NF; ver=name; sub(/^Xcode_?/, "", ver); sub(/\.app$/, "", ver);
                         split(ver, v, "."); printf "%d.%d.%d %s\n", v[1]+0, v[2]+0, v[3]+0, name }' \
            | sort -k1,1n -k2,2n -k3,3n | tail -1 | cut -d' ' -f2)"
          sudo xcode-select -s "/Applications/$NEWEST_XCODE"
          echo "DEVELOPER_DIR=/Applications/$NEWEST_XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Checkout Ladybird source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LADYBIRD_REPO }}
          ref: ${{ env.LADYBIRD_REF }}
          fetch-depth: 0
          path: ladybird

      - name: Record source commit
        id: rev
        run: |
          cd ladybird
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies (Homebrew)
        run: |
          brew install autoconf autoconf-archive automake ccache cmake \
            libtool nasm ninja pkg-config qt llvm@21
          command -v rustup >/dev/null 2>&1 || {
            echo "::error::rustup not found on the runner image"
            exit 1
          }
          (cd ladybird && rustc --version && rustup show active-toolchain)

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ladybird-macos-arm64-ccache-${{ hashFiles('ladybird/vcpkg.json', 'ladybird/vcpkg-configuration.json') }}
          restore-keys: |
            ladybird-macos-arm64-ccache-

      - name: Build Ladybird
        working-directory: ladybird
        run: |
          export PATH="/opt/homebrew/opt/llvm@21/bin:$PATH"
          # Upstream defaults to -march=native/-Ctarget-cpu=native. On GitHub's Apple
          # Silicon runners that trips ring's darwin CPU-feature asserts at compile
          # time (briansmith/ring#2528: use a NAMED cpu, never native), and it bakes
          # runner-only ISA into binaries we ship to other machines. Upstream's own
          # knob switches both compilers to a named baseline (apple-m1 here,
          # armv8.2-a / x86-64-v2 on Linux); ladybird.py cannot forward -D, so flip
          # the option default in the checkout and verify it took.
          sed -i.bak 's/\(ENABLE_CI_BASELINE_CPU .*\) OFF)/\1 ON)/' Meta/CMake/cmake_options.cmake
          grep -q 'ENABLE_CI_BASELINE_CPU ".*" ON)' Meta/CMake/cmake_options.cmake || {
            echo "::error::could not enable ENABLE_CI_BASELINE_CPU in Meta/CMake/cmake_options.cmake"
            exit 1
          }
          LOG="$RUNNER_TEMP/build.log"
          STALL_SECONDS=$((15 * 60))
          : > "$LOG"
          CC="$(brew --prefix llvm@21)/bin/clang" \
          CXX="$(brew --prefix llvm@21)/bin/clang++" \
          ./Meta/ladybird.py build > "$LOG" 2>&1 &
          BUILD_PID=$!
          PRINTED=0
          LAST_GROWTH=$(date +%s)
          while kill -0 "$BUILD_PID" 2>/dev/null; do
            sleep 30
            TOTAL=$(wc -l < "$LOG" | tr -d ' ')
            if [ "$TOTAL" -gt "$PRINTED" ]; then
              tail -n "+$((PRINTED + 1))" "$LOG"
              PRINTED=$TOTAL
              LAST_GROWTH=$(date +%s)
            elif [ $(($(date +%s) - LAST_GROWTH)) -gt "$STALL_SECONDS" ]; then
              echo "::error::build printed nothing for $((STALL_SECONDS / 60)) minutes"
              kill -TERM "$BUILD_PID" 2>/dev/null || true
              sleep 10
              kill -KILL "$BUILD_PID" 2>/dev/null || true
              exit 1
            fi
          done
          wait "$BUILD_PID"

      - name: Package .app bundle
        working-directory: ladybird
        run: |
          curl -fsSL -o "$RUNNER_TEMP/package-macos-app-bundle.py" \
            "https://raw.githubusercontent.com/LadybirdBrowser/ladybird/ef22931735af84de985856b1eb85e1d69ec71005/Meta/package-macos-app-bundle.py"
          cmake --install Build/release --prefix "$RUNNER_TEMP/install" --strip
          python3 "$RUNNER_TEMP/package-macos-app-bundle.py" \
            --build-dir Build/release \
            --install-dir "$RUNNER_TEMP/install" \
            --output "$RUNNER_TEMP/Ladybird-macos-arm64.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -xzf "$RUNNER_TEMP/Ladybird-macos-arm64.tar.gz" -C "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Ladybird.app" "$GITHUB_WORKSPACE/dist/Ladybird-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ladybird-macos-arm64
          path: dist/Ladybird-macos-arm64.zip

  build-linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    container: ghcr.io/ladybirdbrowser/ladybird-ci:2026.10.29
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    outputs:
      date: ${{ steps.rev.outputs.date }}
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - name: Self-test failure
        if: github.event.inputs.selftest_failure == 'true'
        run: |
          echo "::error::deliberate failure - dispatched as a notification self-test"
          exit 1

      - name: Checkout Ladybird source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.LADYBIRD_REPO }}
          ref: ${{ env.LADYBIRD_REF }}
          fetch-depth: 0
          path: ladybird

      - name: Record source commit
        id: rev
        run: |
          cd ladybird
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          # The CI image installs cargo via rustup under /opt/cargo (CARGO_HOME), but a
          # container job does not always inherit the image's PATH, so add it ourselves
          # before deciding the toolchain is missing.
          export PATH="${CARGO_HOME:-/opt/cargo}/bin:$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::warning::rustup not on PATH (PATH=$PATH); listing cargo homes"
            ls -l /opt/cargo/bin "$HOME/.cargo/bin" 2>&1 || true
            # Same rule as the macOS job: honor upstream's rust-toolchain.toml pin
            # instead of whatever rustc an apt package would give us.
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
          fi
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          (cd ladybird && rustc --version && rustup show active-toolchain)

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ladybird-linux-${{ matrix.arch }}-ccache-${{ hashFiles('ladybird/vcpkg.json', 'ladybird/vcpkg-configuration.json') }}
          restore-keys: |
            ladybird-linux-${{ matrix.arch }}-ccache-

      - name: Build Ladybird
        working-directory: ladybird
        run: |
          # ladybird.py exits early as root ("Do not run ladybird.py as root") and a
          # container job IS root, so drive cmake directly, exactly like upstream's
          # own CI does inside this same image. That also gives us a place to pass
          # -DENABLE_CI_BASELINE_CPU=ON: keep the shipped binaries on a named CPU
          # baseline (armv8.2-a / x86-64-v2) instead of -march=native on the runner.
          LOG="$RUNNER_TEMP/build.log"
          STALL_SECONDS=$((15 * 60))
          : > "$LOG"
          (
            cmake --preset Release -DENABLE_CI_BASELINE_CPU=ON \
              -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
              -DPKG_CONFIG_EXECUTABLE="$(command -v pkg-config)"
            cmake --build --preset Release -j "$(nproc)"
          ) > "$LOG" 2>&1 &
          BUILD_PID=$!
          PRINTED=0
          LAST_GROWTH=$(date +%s)
          while kill -0 "$BUILD_PID" 2>/dev/null; do
            sleep 30
            TOTAL=$(wc -l < "$LOG" | tr -d ' ')
            if [ "$TOTAL" -gt "$PRINTED" ]; then
              tail -n "+$((PRINTED + 1))" "$LOG"
              PRINTED=$TOTAL
              LAST_GROWTH=$(date +%s)
            elif [ $(($(date +%s) - LAST_GROWTH)) -gt "$STALL_SECONDS" ]; then
              echo "::error::build printed nothing for $((STALL_SECONDS / 60)) minutes"
              kill -TERM "$BUILD_PID" 2>/dev/null || true
              sleep 10
              kill -KILL "$BUILD_PID" 2>/dev/null || true
              exit 1
            fi
          done
          wait "$BUILD_PID"

      - name: Package
        working-directory: ladybird
        run: |
          cmake --install Build/release --prefix "$RUNNER_TEMP/install" --strip
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -czf "$GITHUB_WORKSPACE/dist/Ladybird-linux-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP/install" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ladybird-linux-${{ matrix.arch }}
          path: dist/Ladybird-linux-${{ matrix.arch }}.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux]
    outputs:
      date: ${{ needs.build-macos.outputs.date }}
      sha: ${{ needs.build-macos.outputs.sha }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp artifacts/ladybird-macos-arm64/Ladybird-macos-arm64.zip dist/
          cp artifacts/ladybird-linux-arm64/Ladybird-linux-arm64.tar.gz dist/
          cp artifacts/ladybird-linux-x86_64/Ladybird-linux-x86_64.tar.gz dist/
          ls -lh dist

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="build-${{ needs.build-macos.outputs.date }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"
            exit 1
          fi
          echo "no existing release $TAG - safe to publish"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ needs.build-macos.outputs.date }}
          name: "Ladybird build ${{ needs.build-macos.outputs.date }} (${{ needs.build-macos.outputs.sha }})"
          body: |
            Unofficial builds of Ladybird.
            macOS arm64: Ladybird-macos-arm64.zip
            Linux arm64 (mars/omarchy): Ladybird-linux-arm64.tar.gz
            Linux x86_64 (CachyOS): Ladybird-linux-x86_64.tar.gz
          files: |
            dist/Ladybird-macos-arm64.zip
            dist/Ladybird-linux-arm64.tar.gz
            dist/Ladybird-linux-x86_64.tar.gz
          make_latest: true

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          KEEP="${{ env.RELEASE_RETENTION }}"
          gh release list --limit 200 --json tagName \
            --jq "sort_by(.tagName | (capture(\"(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})$\") // {\"d\":\"0\"}).d) | reverse | .[$KEEP:] | .[].tagName" \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                echo "pruning $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done

      - name: Checkout this repo for the flake pin
        uses: actions/checkout@v7
        with:
          path: self

      - name: Update flake pin
        working-directory: self
        run: |
          ZIP="artifacts/ladybird-macos-arm64/Ladybird-macos-arm64.zip"
          # artifact was downloaded to artifacts/... but also dist has copy
          ZIP="dist/Ladybird-macos-arm64.zip"
          DATE="${{ needs.build-macos.outputs.date }}"
          TAG="build-$DATE"
          HASH="sha256-$(openssl dgst -sha256 -binary "$ZIP" | base64)"
          python3 - "$TAG" "$DATE" "$HASH" <<'PY'
          import pathlib, re, sys
          tag, version, hash_ = sys.argv[1], sys.argv[2], sys.argv[3]
          path = pathlib.Path("flake.nix")
          text = path.read_text()
          text, tag_hits = re.subn(r'releaseTag = "[^"]*";', f'releaseTag = "{tag}";', text, count=1)
          text, version_hits = re.subn(r'version = "[^"]*";', f'version = "{version}";', text, count=1)
          text, hash_hits = re.subn(r'hash = "sha256-[^"]*";', f'hash = "{hash_}";', text, count=1)
          if tag_hits != 1 or version_hits != 1 or hash_hits != 1:
              sys.exit(f"error: patched {tag_hits}/{version_hits}/{hash_hits}")
          path.write_text(text)
          print(f"pinned {tag} {hash_}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          if git diff --cached --quiet; then
            echo "flake.nix already pins $TAG - nothing to do"
          else
            git commit -m "chore(flake): pin release $TAG"
            git push
          fi

  notify:
    runs-on: ubuntu-latest
    if: always() && failure()
    needs: [build-macos, build-linux, publish]
    steps:
      - name: File or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Ladybird build failure"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="The Ladybird build failed.\n\n- run: $RUN_URL\n"
          EXISTING="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' \
            | awk -F'\t' -v title="$TITLE" '$2 == title { print $1; exit }')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi