[tools]
actionlint = "1.7.12"
lefthook = "2.1.11"
shfmt = "3.13.1"
"npm:markdownlint-cli" = "0.47.0"
# shellcheck is required by actionlint: it auto-detects the binary on PATH.
# Pin it here so the mise shim resolves to a real version (otherwise actionlint
# fails with "No version is set for shim: shellcheck").
shellcheck = "0.11.0"
# nixfmt is managed by Nix (nixpkgs), not mise — available on PATH.
# markdownlint-cli is managed by mise's npm backend. No Ruby toolchain here
# any more: the Homebrew cask lives in remusa/homebrew-tap.

[tasks.lint]
description = "Run all linters"
run = """
mise run lint:yaml
mise run lint:nix
mise run lint:markdown
"""

[tasks."lint:yaml"]
description = "Lint GitHub Actions workflows with actionlint"
run = "actionlint .github/workflows/*.yml"

[tasks."lint:nix"]
description = "Check Nix formatting with nixfmt"
run = "nixfmt --check flake.nix"

[tasks."lint:markdown"]
description = "Lint Markdown with markdownlint"
run = "markdownlint '*.md'"

[tasks.fmt]
description = "Auto-fix formatting everywhere"
run = """
mise run fmt:nix
mise run fmt:markdown
mise run fmt:shell
"""

[tasks."fmt:nix"]
description = "Format Nix files with nixfmt"
run = "nixfmt flake.nix"

[tasks."fmt:markdown"]
description = "Fix Markdown formatting"
run = "markdownlint --fix '*.md'"

[tasks."fmt:shell"]
description = "Format shell scripts with shfmt"
run = "shfmt -w -i 2 -bn -ci ."

[tasks.check]
description = "Lint + format check (CI-friendly, no writes)"
run = "mise run lint"
